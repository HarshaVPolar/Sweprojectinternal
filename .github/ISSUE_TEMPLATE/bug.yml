name: Bug
description: Something does not behave as specified
title: "[bug] "
labels:
  - "type:bug"
body:
  - type: input
    id: requirements
    attributes:
      label: SRS requirement IDs affected
      placeholder: FR-5.11
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Expected and actual behaviour
    validations:
      required: true
  - type: dropdown
    id: severity
    attributes:
      label: Severity
      options:
        - low
        - medium
        - high
    validations:
      required: true
