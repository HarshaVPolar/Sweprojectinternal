[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "ytmcp"
version = "0.1.0"
description = "YouTube Video Intelligence MCP Server"
requires-python = ">=3.11"
dependencies = [
  "mcp",
  "httpx",
  "pydantic>=2",
  "keyring",
  "google-auth-oauthlib",
  "cryptography",
  "tzdata",
]

[project.optional-dependencies]
dev = [
  "pytest",
  "pytest-cov",
  "pytest-xdist",
  "hypothesis",
  "ruff",
  "mypy",
  "import-linter",
  "pip-audit",
  "pip-licenses",
  "bandit",
  "pre-commit",
]
mutation = ["mutmut"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra --strict-markers"
markers = [
  "unit: unit tests",
  "integration: integration tests",
  "system: end-to-end tests through the MCP interface",
  "negative: negative tests",
  "security: security tests",
  "live: tests that call the live YouTube API (never run in pull-request CI)",
]

[tool.coverage.run]
source = ["ytmcp"]
branch = true

[tool.coverage.report]
show_missing = true

[tool.ruff]
line-length = 100
target-version = "py311"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "C90"]

[tool.ruff.lint.mccabe]
max-complexity = 10

[tool.mypy]
python_version = "3.11"
ignore_missing_imports = true

[[tool.mypy.overrides]]
module = "ytmcp.domain.*"
disallow_untyped_defs = true
disallow_incomplete_defs = true
disallow_untyped_calls = true
disallow_untyped_decorators = true
disallow_any_generics = true
disallow_subclassing_any = true
check_untyped_defs = true
no_implicit_optional = true
warn_return_any = true
warn_unused_ignores = true

[tool.importlinter]
root_package = "ytmcp"

[[tool.importlinter.contracts]]
name = "domain is pure"
type = "forbidden"
source_modules = ["ytmcp.domain"]
forbidden_modules = [
  "ytmcp.services",
  "ytmcp.providers",
  "ytmcp.infra",
  "ytmcp.tools",
  "ytmcp.resources",
  "ytmcp.config",
]
allow_indirect_imports = true

[[tool.importlinter.contracts]]
name = "tools and resources use services only"
type = "forbidden"
source_modules = ["ytmcp.tools", "ytmcp.resources"]
forbidden_modules = ["ytmcp.providers", "ytmcp.infra", "ytmcp.domain"]
allow_indirect_imports = true

[[tool.importlinter.contracts]]
name = "services do not reach upward or into concrete providers"
type = "forbidden"
source_modules = ["ytmcp.services"]
forbidden_modules = [
  "ytmcp.tools",
  "ytmcp.resources",
  "ytmcp.providers.live",
  "ytmcp.providers.fixture",
  "ytmcp.providers.recording",
]
allow_indirect_imports = true

[[tool.importlinter.contracts]]
name = "providers do not import services or tools"
type = "forbidden"
source_modules = ["ytmcp.providers"]
forbidden_modules = ["ytmcp.services", "ytmcp.tools", "ytmcp.resources"]
allow_indirect_imports = true

[[tool.importlinter.contracts]]
name = "infra does not import services, tools or providers"
type = "forbidden"
source_modules = ["ytmcp.infra"]
forbidden_modules = [
  "ytmcp.services",
  "ytmcp.tools",
  "ytmcp.resources",
  "ytmcp.providers",
]
allow_indirect_imports = true
