repos:
  - repo: https://github.com/gitleaks/gitleaks
    rev: v8.21.2
    hooks:
      - id: gitleaks
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v5.0.0
    hooks:
      - id: check-added-large-files
      - id: check-yaml
      - id: check-toml
  - repo: local
    hooks:
      - id: ruff-check
        name: ruff check
        entry: python -m ruff check .
        language: system
        pass_filenames: false
        always_run: true
      - id: ruff-format-check
        name: ruff format check
        entry: python -m ruff format --check .
        language: system
        pass_filenames: false
        always_run: true
      - id: validate-skills
        name: validate skills
        entry: python scripts/validate_skills.py
        language: system
        pass_filenames: false
        always_run: true
      - id: validate-brain
        name: validate brain
        entry: python scripts/validate_brain.py
        language: system
        pass_filenames: false
        always_run: true
